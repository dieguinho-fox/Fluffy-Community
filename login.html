<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - Fluffy Community</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #10131a;
            color: #ffffff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 500px;

            padding: 30px;

            background: #181d27;

            border: 1px solid #293140;
            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 6px;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
            color: #ffffff;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: #9ca8ba;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #ffffff;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #303948;
            border-radius: 10px;

            outline: none;

            background: #11151d;
            color: #ffffff;

            font-size: 16px;

            transition:
                border-color 0.15s,
                background 0.15s,
                box-shadow 0.15s;
        }

        input::placeholder {
            color: #687487;
        }

        input:focus {
            border-color: #5865f2;
            background: #141923;

            box-shadow:
                0 0 0 3px rgba(88, 101, 242, 0.15);
        }

        button {
            width: 100%;

            padding: 14px;

            border: 0;
            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s,
                opacity 0.15s,
                transform 0.05s;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginButton {
            background: #5865f2;
            color: #ffffff;
        }

        #loginButton:hover {
            background: #4752c4;
        }

        #googleLoginButton {
            margin-top: 0;

            background: #252c38;
            color: #ffffff;

            border: 1px solid #303948;
        }

        #googleLoginButton:hover {
            background: #303846;
        }

        .divider {
            display: flex;
            align-items: center;

            gap: 10px;

            margin: 22px 0;

            color: #748094;

            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #303948;
        }

        #message {
            display: none;

            margin-bottom: 18px;

            padding: 13px;

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.4;

            text-align: center;
        }

        #message.success {
            background: #193326;
            border: 1px solid #2d6545;
            color: #70d69a;
        }

        #message.error {
            background: #2b1c20;
            border: 1px solid #603039;
            color: #ff8f8f;
        }

        .links {
            margin-top: 22px;

            text-align: center;

            color: #9ca8ba;

            font-size: 14px;
            line-height: 1.5;
        }

        .links p {
            margin: 10px 0;
        }

        .links a {
            color: #7280ff;
            font-weight: bold;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .brand {
            margin-top: 20px;

            text-align: center;

            font-size: 12px;

            color: #5f6a7c;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .login-container {
                padding: 22px 18px;
                border-radius: 14px;
            }

            .logo {
                font-size: 38px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                margin-bottom: 24px;
            }
        }
    </style>

</head>

<body>

<main class="login-container">

    <div class="logo">
        🐾
    </div>

    <h1>
        Entrar
    </h1>

    <p class="subtitle">
        Entre na sua conta Fluffy Account
    </p>

    <div id="message"></div>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                autocomplete="email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Senha
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            type="submit"
            id="loginButton"
        >
            Entrar
        </button>

    </form>

    <div class="divider">
        ou
    </div>

    <button
        type="button"
        id="googleLoginButton"
    >
        Continuar com Google
    </button>

    <div class="links">

        <p>
            Ainda não possui uma conta?
            <a href="register.html">
                Criar conta
            </a>
        </p>

        <p>
            <a href="index.html">
                Voltar para a comunidade
            </a>
        </p>

    </div>

    <div class="brand">
        Fluffy Studios · Fluffy Account
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://wnihobtfpmabgfwoddye.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_Y-S1kbAXQE-Y4j-seMaHrQ_u_vUoTFF";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const googleLoginButton =
        document.getElementById(
            "googleLoginButton"
        );

    const message =
        document.getElementById("message");

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

        message.style.display = "block";
    }

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            if (!email || !password) {

                showMessage(
                    "Preencha todos os campos.",
                    "error"
                );

                return;
            }

            loginButton.disabled = true;

            loginButton.textContent =
                "Entrando...";

            message.style.display =
                "none";

            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });

                if (error) {

                    console.error(
                        "Erro no login:",
                        error
                    );

                    if (
                        error.message
                            .toLowerCase()
                            .includes(
                                "invalid login credentials"
                            )
                    ) {

                        showMessage(
                            "E-mail ou senha incorretos.",
                            "error"
                        );

                    } else {

                        showMessage(
                            error.message,
                            "error"
                        );

                    }

                    return;
                }

                if (!data.session) {

                    showMessage(
                        "Login realizado, mas nenhuma sessão foi criada.",
                        "error"
                    );

                    return;
                }

                showMessage(
                    "Login realizado com sucesso!",
                    "success"
                );

                setTimeout(
                    function () {

                        window.location.href =
                            "index.html";

                    },
                    800
                );

            } catch (error) {

                console.error(
                    "Erro inesperado no login:",
                    error
                );

                showMessage(
                    "Ocorreu um erro ao tentar entrar.",
                    "error"
                );

            } finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Entrar";
            }

        }
    );

    googleLoginButton.addEventListener(
        "click",
        async function () {

            googleLoginButton.disabled =
                true;

            googleLoginButton.textContent =
                "Abrindo Google...";

            try {

                const { error } =
                    await supabaseClient.auth.signInWithOAuth({

                        provider: "google",

                        options: {

                            redirectTo:
                                "https://dieguinho-fox.github.io/Fluffy-Community/"

                        }

                    });

                if (error) {

                    console.error(
                        "Erro no Google Login:",
                        error
                    );

                    showMessage(
                        "Não foi possível iniciar o login com Google.",
                        "error"
                    );

                    googleLoginButton.disabled =
                        false;

                    googleLoginButton.textContent =
                        "Continuar com Google";
                }

            } catch (error) {

                console.error(
                    "Erro inesperado:",
                    error
                );

                showMessage(
                    "Ocorreu um erro ao iniciar o login com Google.",
                    "error"
                );

                googleLoginButton.disabled =
                    false;

                googleLoginButton.textContent =
                    "Continuar com Google";
            }

        }
    );

</script>

</body>
</html>
