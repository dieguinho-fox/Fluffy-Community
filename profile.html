<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - Fluffy Community</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f8;
            color: #222;
        }

        header {
            background: #6c4cff;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            border: 4px solid #6c4cff;
        }

        .profile-info h2 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .profile-info p {
            margin: 5px 0;
            color: #666;
        }

        .bio {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: #f5f3ff;
            white-space: pre-wrap;
        }

        .section {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .section h2 {
            margin-top: 0;
        }

        .achievements-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .achievement {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 15px;
            border-radius: 14px;
            background: #f7f7fa;
            border: 1px solid #e5e5e5;
        }

        .achievement-icon {
            width: 70px;
            height: 70px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-info h3 {
            margin: 0 0 6px;
        }

        .achievement-info p {
            margin: 0;
            color: #666;
        }

        .secret-label {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            background: #6c4cff;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .sync-container {
            margin-top: 20px;
        }

        #syncAchievementsButton {
            display: none;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            background: #6c4cff;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #syncAchievementsButton:hover {
            background: #5638e6;
        }

        #syncAchievementsButton:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #syncStatus {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .loading,
        .error,
        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .error {
            color: #c62828;
        }

        @media (max-width: 600px) {
            .profile-card,
            .section {
                padding: 20px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .achievement {
                align-items: flex-start;
            }

            .achievement-icon {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Fluffy Community</h1>

    <nav>
        <a href="index.html">Início</a>
        <a id="accountLink" href="login.html">Entrar</a>
    </nav>
</header>

<main>

    <div id="loading" class="loading">
        Carregando perfil...
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="profileContent" style="display: none;">

        <section class="profile-card">

            <div class="profile-header">

                <img
                    id="avatar"
                    class="avatar"
                    src=""
                    alt="Foto de perfil"
                >

                <div class="profile-info">
                    <h2 id="username">Usuário</h2>

                    <p>
                        Conta criada em:
                        <span id="createdAt">-</span>
                    </p>
                </div>

            </div>

            <div
                id="bio"
                class="bio"
                style="display: none;"
            ></div>

            <div class="sync-container">

                <button
                    id="syncAchievementsButton"
                    type="button"
                >
                    🔄 Sincronizar conquistas
                </button>

                <div id="syncStatus"></div>

            </div>

        </section>

        <section class="section">

            <h2>🎮 Jogos</h2>

            <div id="games">
                <div class="empty">
                    Fluffy Adventure
                </div>
            </div>

        </section>

        <section class="section">

            <h2>🏆 Conquistas</h2>

            <div
                id="achievements"
                class="achievements-list"
            ></div>

        </section>

        <section class="section">

            <h2>📋 Atividade</h2>

            <div class="empty">
                Nenhuma atividade disponível.
            </div>

        </section>

    </div>

</main>

<script>
    const SUPABASE_URL = "https://wnihobtfpmabgfwoddye.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_Y-S1kbAXQE-Y4j-seMaHrQ_u_vUoTFF";

    const ACHIEVEMENTS_JSON_URL =
        "https://raw.githubusercontent.com/dieguinho-fox/Fluffy-Adventure/main/Conquistas/achievements.json";

    const ACHIEVEMENTS_BASE_URL =
        "https://raw.githubusercontent.com/dieguinho-fox/Fluffy-Adventure/main/";

    const SAVE_BUCKET = "saves";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const loadingElement = document.getElementById("loading");
    const errorElement = document.getElementById("error");
    const profileContent = document.getElementById("profileContent");

    const avatarElement = document.getElementById("avatar");
    const usernameElement = document.getElementById("username");
    const createdAtElement = document.getElementById("createdAt");
    const bioElement = document.getElementById("bio");

    const achievementsElement =
        document.getElementById("achievements");

    const syncButton =
        document.getElementById("syncAchievementsButton");

    const syncStatus =
        document.getElementById("syncStatus");

    const accountLink =
        document.getElementById("accountLink");

    let currentProfile = null;
    let currentSession = null;
    let achievementsData = {};

    function showError(message) {
        loadingElement.style.display = "none";
        profileContent.style.display = "none";

        errorElement.textContent = message;
        errorElement.style.display = "block";
    }

    function formatDate(dateString) {
        if (!dateString) {
            return "-";
        }

        const date = new Date(dateString);

        if (Number.isNaN(date.getTime())) {
            return "-";
        }

        return date.toLocaleDateString("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }

    function buildIconUrl(iconPath) {
        if (!iconPath) {
            return "";
        }

        let cleanPath = iconPath;

        cleanPath = cleanPath.replace(/^res:\/\//, "");
        cleanPath = cleanPath.replace(/^\/+/, "");

        const encodedPath = cleanPath
            .split("/")
            .map(segment => encodeURIComponent(segment))
            .join("/");

        return ACHIEVEMENTS_BASE_URL + encodedPath;
    }

    function normalizeAchievementIds(value) {
        if (!Array.isArray(value)) {
            return [];
        }

        return value
            .map(id => String(id))
            .filter(id => id.length > 0);
    }

    async function loadAchievementsData() {
        const response = await fetch(ACHIEVEMENTS_JSON_URL, {
            cache: "no-cache"
        });

        if (!response.ok) {
            throw new Error(
                "Não foi possível carregar o catálogo de conquistas."
            );
        }

        const data = await response.json();

        if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error(
                "O arquivo achievements.json possui formato inválido."
            );
        }

        achievementsData = data;
    }

    function getLocalizedText(value) {
        if (!value || typeof value !== "object") {
            return "";
        }

        const languages = [
            "pt_BR",
            "pt-BR",
            "en_US",
            "en-US",
            "es_ES",
            "es",
            "ja_JP",
            "ja"
        ];

        for (const language of languages) {
            if (
                Object.prototype.hasOwnProperty.call(
                    value,
                    language
                )
            ) {
                return value[language];
            }
        }

        const keys = Object.keys(value);

        if (keys.length > 0) {
            return value[keys[0]];
        }

        return "";
    }

    function renderAchievements(unlockedIds) {
        achievementsElement.innerHTML = "";

        const unlockedSet = new Set(
            normalizeAchievementIds(unlockedIds)
        );

        const achievementIds = Object.keys(achievementsData);

        if (achievementIds.length === 0) {
            achievementsElement.innerHTML =
                '<div class="empty">Nenhuma conquista disponível.</div>';

            return;
        }

        let renderedCount = 0;

        for (const id of achievementIds) {

            const achievement =
                achievementsData[id];

            if (
                !achievement ||
                typeof achievement !== "object"
            ) {
                continue;
            }

            const unlocked = unlockedSet.has(id);
            const secret = achievement.secret === true;

            if (!unlocked && secret) {
                continue;
            }

            const card =
                document.createElement("div");

            card.className = "achievement";

            const icon =
                document.createElement("img");

            icon.className = "achievement-icon";

            if (unlocked && achievement.icon) {
                icon.src =
                    buildIconUrl(achievement.icon);
            } else {
                icon.src =
                    buildIconUrl(
                        "res://Conquistas/Ícones/bloqueado.png"
                    );
            }

            icon.alt = "";

            const info =
                document.createElement("div");

            info.className = "achievement-info";

            const title =
                document.createElement("h3");

            const description =
                document.createElement("p");

            if (unlocked) {

                title.textContent =
                    getLocalizedText(
                        achievement.name
                    ) || id;

                description.textContent =
                    getLocalizedText(
                        achievement.description
                    );

            } else {

                title.textContent = "???";
                description.textContent = "???";
            }

            info.appendChild(title);
            info.appendChild(description);

            if (secret) {
                const secretLabel =
                    document.createElement("span");

                secretLabel.className =
                    "secret-label";

                secretLabel.textContent =
                    "SECRETA";

                info.appendChild(secretLabel);
            }

            card.appendChild(icon);
            card.appendChild(info);

            achievementsElement.appendChild(card);

            renderedCount++;
        }

        if (renderedCount === 0) {
            achievementsElement.innerHTML =
                '<div class="empty">Nenhuma conquista desbloqueada.</div>';
        }
    }

    async function loadProfile(profileId) {

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(
                "id, username, created_at, avatar_url, bio, achievements"
            )
            .eq("id", profileId)
            .maybeSingle();

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                "Perfil não encontrado."
            );
        }

        currentProfile = data;

        usernameElement.textContent =
            data.username || "FluffyPlayer";

        createdAtElement.textContent =
            formatDate(data.created_at);

        if (data.avatar_url) {
            avatarElement.src =
                data.avatar_url;
        } else {
            avatarElement.src =
                "https://ui-avatars.com/api/?name=" +
                encodeURIComponent(
                    data.username || "FluffyPlayer"
                ) +
                "&background=6c4cff&color=fff&size=220";
        }

        if (
            data.bio &&
            String(data.bio).trim() !== ""
        ) {
            bioElement.textContent = data.bio;
            bioElement.style.display = "block";
        } else {
            bioElement.style.display = "none";
        }

        renderAchievements(
            normalizeAchievementIds(
                data.achievements
            )
        );
    }

    async function updateAccountNavigation() {

        const {
            data
        } = await supabaseClient.auth.getSession();

        currentSession =
            data ? data.session : null;

        if (currentSession) {
            accountLink.textContent =
                "Minha conta";

            accountLink.href =
                "index.html";
        } else {
            accountLink.textContent =
                "Entrar";

            accountLink.href =
                "login.html";
        }
    }

    async function checkProfileOwner() {

        if (!currentProfile) {
            syncButton.style.display = "none";
            return;
        }

        if (!currentSession) {
            syncButton.style.display = "none";
            return;
        }

        if (
            currentSession.user.id !==
            currentProfile.id
        ) {
            syncButton.style.display = "none";
            return;
        }

        syncButton.style.display = "inline-block";
    }

    async function synchronizeAchievements() {

        if (!currentSession) {
            syncStatus.textContent =
                "Você precisa estar conectado para sincronizar.";

            return;
        }

        if (!currentProfile) {
            syncStatus.textContent =
                "Perfil inválido.";

            return;
        }

        if (
            currentSession.user.id !==
            currentProfile.id
        ) {
            syncStatus.textContent =
                "Você só pode sincronizar suas próprias conquistas.";

            return;
        }

        syncButton.disabled = true;

        syncStatus.textContent =
            "Baixando conquistas salvas...";

        try {

            const userId =
                currentSession.user.id;

            const filePath =
                userId + "/achievements.json";

            const {
                data: signedUrlData,
                error: signedUrlError
            } = await supabaseClient.storage
                .from(SAVE_BUCKET)
                .createSignedUrl(
                    filePath,
                    60
                );

            if (signedUrlError) {
                throw signedUrlError;
            }

            if (
                !signedUrlData ||
                !signedUrlData.signedUrl
            ) {
                throw new Error(
                    "Não foi possível gerar o link do arquivo."
                );
            }

            syncStatus.textContent =
                "Lendo conquistas...";

            const response =
                await fetch(
                    signedUrlData.signedUrl,
                    {
                        cache: "no-cache"
                    }
                );

            if (!response.ok) {

                if (response.status === 404) {
                    throw new Error(
                        "O arquivo achievements.json ainda não foi enviado pelo jogo."
                    );
                }

                throw new Error(
                    "Não foi possível baixar achievements.json."
                );
            }

            const json =
                await response.json();

            let unlockedIds = [];

            if (Array.isArray(json)) {

                unlockedIds =
                    normalizeAchievementIds(json);

            } else if (
                json &&
                typeof json === "object"
            ) {

                if (
                    Array.isArray(
                        json.achievements
                    )
                ) {
                    unlockedIds =
                        normalizeAchievementIds(
                            json.achievements
                        );
                } else {

                    unlockedIds =
                        Object.keys(json)
                            .filter(
                                id =>
                                    json[id] === true
                            );
                }
            }

            syncStatus.textContent =
                "Atualizando perfil...";

            const {
                error: updateError
            } = await supabaseClient
                .from("profiles")
                .update({
                    achievements: unlockedIds
                })
                .eq(
                    "id",
                    userId
                );

            if (updateError) {
                throw updateError;
            }

            currentProfile.achievements =
                unlockedIds;

            renderAchievements(
                unlockedIds
            );

            syncStatus.textContent =
                "✅ Conquistas sincronizadas com sucesso.";

        } catch (error) {

            console.error(
                "[Fluffy Community] Erro ao sincronizar conquistas:",
                error
            );

            syncStatus.textContent =
                "❌ " +
                (
                    error.message ||
                    "Não foi possível sincronizar as conquistas."
                );

        } finally {

            syncButton.disabled = false;
        }
    }

    async function initialize() {

        try {

            await updateAccountNavigation();

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const profileId =
                params.get("id");

            if (!profileId) {
                throw new Error(
                    "Nenhum perfil foi especificado."
                );
            }

            await loadAchievementsData();

            await loadProfile(
                profileId
            );

            await checkProfileOwner();

            loadingElement.style.display =
                "none";

            profileContent.style.display =
                "block";

        } catch (error) {

            console.error(
                "[Fluffy Community] Erro:",
                error
            );

            showError(
                error.message ||
                "Não foi possível carregar o perfil."
            );
        }
    }

    syncButton.addEventListener(
        "click",
        synchronizeAchievements
    );

    supabaseClient.auth.onAuthStateChange(
        async (_event, session) => {

            currentSession = session;

            if (session) {

                accountLink.textContent =
                    "Minha conta";

                accountLink.href =
                    "index.html";

            } else {

                accountLink.textContent =
                    "Entrar";

                accountLink.href =
                    "login.html";
            }

            await checkProfileOwner();
        }
    );

    initialize();
</script>

</body>
</html>
