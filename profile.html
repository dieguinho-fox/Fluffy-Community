<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - Fluffy Community</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0 0 5px;
        }

        header p {
            margin: 0;
            color: #666;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            margin: 0 8px;
            text-decoration: none;
            color: #5865f2;
            font-weight: bold;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            margin-bottom: 15px;
        }

        .username {
            margin: 0;
            font-size: 28px;
        }

        .handle {
            margin-top: 5px;
            color: #777;
            font-size: 16px;
        }

        .bio {
            margin: 25px auto;
            max-width: 500px;
            color: #444;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .profile-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
        }

        .error {
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            color: #c62828;
        }

        .loading {
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Fluffy Community</h1>
        <p>A comunidade oficial da Fluffy Studios</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main>

        <div id="profileContainer">
            <p class="loading">Carregando perfil...</p>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://wnihobtfpmabgfwoddye.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Y-S1kbAXQE-Y4j-seMaHrQ_u_vUoTFF";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        const profileContainer =
            document.getElementById(
                "profileContainer"
            );

        async function loadProfile() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const profileId =
                params.get("id");

            if (!profileId) {

                showError(
                    "Nenhum ID de perfil foi informado."
                );

                return;
            }

            try {

                const result =
                    await supabaseClient
                        .from("profiles")
                        .select(
                            "id, username, created_at, avatar_url, bio"
                        )
                        .eq("id", profileId)
                        .maybeSingle();

                const data =
                    result.data;

                const error =
                    result.error;

                if (error) {

                    console.error(
                        "Erro ao carregar perfil:",
                        error
                    );

                    showError(
                        "Não foi possível carregar este perfil."
                    );

                    return;
                }

                if (!data) {

                    showError(
                        "Este perfil não existe."
                    );

                    return;
                }

                displayProfile(data);

            } catch (error) {

                console.error(
                    "Erro inesperado:",
                    error
                );

                showError(
                    "Ocorreu um erro ao carregar o perfil."
                );
            }
        }

        function displayProfile(profile) {

            profileContainer.innerHTML = "";

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "profile-card";

            const avatar =
                document.createElement(
                    "img"
                );

            avatar.className =
                "avatar";

            avatar.alt =
                "Foto de perfil de " +
                profile.username;

            if (profile.avatar_url) {

                avatar.src =
                    profile.avatar_url;

            } else {

                avatar.src =
                    "data:image/svg+xml," +
                    encodeURIComponent(`
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="120"
                            height="120"
                            viewBox="0 0 120 120"
                        >
                            <rect
                                width="120"
                                height="120"
                                rx="60"
                                fill="#dddddd"
                            />

                            <circle
                                cx="60"
                                cy="45"
                                r="22"
                                fill="#999999"
                            />

                            <path
                                d="M25 105
                                   C25 80 40 68 60 68
                                   C80 68 95 80 95 105"
                                fill="#999999"
                            />
                        </svg>
                    `);
            }

            const username =
                document.createElement(
                    "h2"
                );

            username.className =
                "username";

            username.textContent =
                profile.username;

            const handle =
                document.createElement(
                    "div"
                );

            handle.className =
                "handle";

            handle.textContent =
                "@" +
                profile.username;

            const bio =
                document.createElement(
                    "p"
                );

            bio.className =
                "bio";

            bio.textContent =
                profile.bio ||
                "Este usuário ainda não adicionou uma bio.";

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "profile-info";

            const createdAt =
                document.createElement(
                    "p"
                );

            const date =
                new Date(
                    profile.created_at
                );

            createdAt.textContent =
                "Membro desde " +
                date.toLocaleDateString(
                    "pt-BR",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

            info.appendChild(
                createdAt
            );

            card.appendChild(
                avatar
            );

            card.appendChild(
                username
            );

            card.appendChild(
                handle
            );

            card.appendChild(
                bio
            );

            card.appendChild(
                info
            );

            profileContainer.appendChild(
                card
            );

            document.title =
                profile.username +
                " - Fluffy Community";
        }

        function showError(message) {

            profileContainer.innerHTML = "";

            const error =
                document.createElement(
                    "div"
                );

            error.className =
                "error";

            const title =
                document.createElement(
                    "h2"
                );

            title.textContent =
                "Ops!";

            const text =
                document.createElement(
                    "p"
                );

            text.textContent =
                message;

            error.appendChild(
                title
            );

            error.appendChild(
                text
            );

            profileContainer.appendChild(
                error
            );
        }

        loadProfile();
    </script>

</body>
</html>
