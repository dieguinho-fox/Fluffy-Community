<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil - Fluffy Community</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    header {
        background: #ffffff;
        border-bottom: 1px solid #ddd;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        margin: 0;
        font-size: 22px;
    }

    nav {
        display: flex;
        gap: 15px;
    }

    nav a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }

    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .profile-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .profile-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        background: #ddd;
    }

    .profile-info h2 {
        margin: 0 0 8px;
        font-size: 28px;
    }

    .profile-info p {
        margin: 5px 0;
        color: #666;
    }

    .bio {
        margin-top: 15px;
        color: #444;
        white-space: pre-wrap;
    }

    .section-title {
        margin-top: 30px;
        margin-bottom: 15px;
        font-size: 22px;
    }

    .game-title {
        font-size: 20px;
        font-weight: bold;
        margin: 15px 0;
    }

    .achievements {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .achievement {
        display: flex;
        align-items: center;
        gap: 15px;
        background: #f8f8f8;
        border: 1px solid #e2e2e2;
        border-radius: 12px;
        padding: 12px;
    }

    .achievement-icon {
        width: 70px;
        height: 70px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .achievement-content {
        flex: 1;
    }

    .achievement-name {
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .achievement-description {
        color: #555;
        line-height: 1.4;
    }

    .achievement-secret {
        display: inline-block;
        margin-top: 7px;
        padding: 3px 7px;
        border-radius: 5px;
        background: #333;
        color: white;
        font-size: 11px;
        font-weight: bold;
    }

    .empty {
        color: #777;
        padding: 15px 0;
    }

    .error {
        background: #ffe5e5;
        color: #b00000;
        border-radius: 10px;
        padding: 15px;
    }

    @media (max-width: 600px) {
        .profile-header {
            flex-direction: column;
            text-align: center;
        }

        .achievement {
            align-items: flex-start;
        }

        .achievement-icon {
            width: 60px;
            height: 60px;
        }
    }
</style>

</head>

<body>

<header>
    <h1>Fluffy Community</h1>

<nav>
    <a href="index.html">Início</a>
    <a id="authLink" href="login.html">Entrar</a>
</nav>

</header>

<div class="container">

<div id="error" class="error" style="display: none;"></div>

<div id="profileCard" class="profile-card" style="display: none;">

    <div class="profile-header">
        <img id="avatar" class="avatar" alt="Avatar">

        <div class="profile-info">
            <h2 id="username">Usuário</h2>
            <p id="createdAt"></p>
            <div id="bio" class="bio"></div>
        </div>
    </div>

    <h3 class="section-title">Conquistas</h3>

    <div class="game-title">Fluffy Adventure</div>

    <div id="achievements" class="achievements"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://wnihobtfpmabgfwoddye.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y-S1kbAXQE-Y4j-seMaHrQ_u_vUoTFF";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ACHIEVEMENTS_JSON_URL =
    "https://raw.githubusercontent.com/dieguinho-fox/Fluffy-Adventure/main/Conquistas/achievements.json";

const ACHIEVEMENTS_BASE_URL =
    "https://raw.githubusercontent.com/dieguinho-fox/Fluffy-Adventure/main/";

const DEFAULT_AVATAR =
    "https://ui-avatars.com/api/?name=Fluffy&background=random";

const CURRENT_LANGUAGE = "pt_BR";

const params = new URLSearchParams(window.location.search);
const profileId = params.get("id");

const profileCard = document.getElementById("profileCard");
const errorElement = document.getElementById("error");
const avatarElement = document.getElementById("avatar");
const usernameElement = document.getElementById("username");
const createdAtElement = document.getElementById("createdAt");
const bioElement = document.getElementById("bio");
const achievementsElement = document.getElementById("achievements");
const authLink = document.getElementById("authLink");


function showError(message) {
    errorElement.textContent = message;
    errorElement.style.display = "block";
    profileCard.style.display = "none";
}


function getLocalizedText(value) {
    if (!value || typeof value !== "object") {
        return "";
    }

    if (value[CURRENT_LANGUAGE]) {
        return value[CURRENT_LANGUAGE];
    }

    if (value.pt) {
        return value.pt;
    }

    if (value.en) {
        return value.en;
    }

    const firstKey = Object.keys(value)[0];

    if (firstKey) {
        return value[firstKey];
    }

    return "";
}


function convertIconPath(iconPath) {
    if (!iconPath) {
        return "";
    }

    let path = iconPath;

    if (path.startsWith("res://")) {
        path = path.substring(6);
    }

    const parts = path.split("/");

    const encodedParts = parts.map(
        part => encodeURIComponent(part)
    );

    return ACHIEVEMENTS_BASE_URL + encodedParts.join("/");
}


function formatDate(dateString) {
    if (!dateString) {
        return "";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
        return "";
    }

    return "Conta criada em " +
        date.toLocaleDateString("pt-BR");
}


function getAchievementCatalogEntry(catalog, achievementId) {
    if (!catalog || typeof catalog !== "object") {
        return null;
    }

    return catalog[achievementId] || null;
}


function renderAchievements(unlockedIds, catalog) {
    achievementsElement.innerHTML = "";

    if (!Array.isArray(unlockedIds) || unlockedIds.length === 0) {
        achievementsElement.innerHTML =
            '<div class="empty">Nenhuma conquista desbloqueada.</div>';

        return;
    }

    let displayedCount = 0;

    for (const achievementId of unlockedIds) {

        const achievement =
            getAchievementCatalogEntry(
                catalog,
                achievementId
            );

        if (!achievement) {
            continue;
        }

        const secret = achievement.secret === true;

        const name =
            getLocalizedText(achievement.name);

        const description =
            getLocalizedText(achievement.description);

        const iconUrl =
            convertIconPath(achievement.icon);

        const article =
            document.createElement("article");

        article.className = "achievement";

        const icon =
            document.createElement("img");

        icon.className = "achievement-icon";

        icon.src = iconUrl;

        icon.alt = name || "Conquista";

        icon.onerror = function () {
            this.src = DEFAULT_AVATAR;
        };

        const content =
            document.createElement("div");

        content.className = "achievement-content";

        const achievementName =
            document.createElement("div");

        achievementName.className =
            "achievement-name";

        achievementName.textContent =
            name || achievementId;

        const achievementDescription =
            document.createElement("div");

        achievementDescription.className =
            "achievement-description";

        achievementDescription.textContent =
            description || "";

        content.appendChild(achievementName);
        content.appendChild(achievementDescription);

        if (secret) {
            const secretBadge =
                document.createElement("span");

            secretBadge.className =
                "achievement-secret";

            secretBadge.textContent =
                "SECRETA";

            content.appendChild(secretBadge);
        }

        article.appendChild(icon);
        article.appendChild(content);

        achievementsElement.appendChild(article);

        displayedCount++;
    }

    if (displayedCount === 0) {
        achievementsElement.innerHTML =
            '<div class="empty">Nenhuma conquista desbloqueada.</div>';
    }
}


async function updateAuthLink() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session && session.user) {
        authLink.textContent = "Minha conta";
        authLink.href = "index.html";
    } else {
        authLink.textContent = "Entrar";
        authLink.href = "login.html";
    }
}


async function loadProfile() {

    if (!profileId) {
        showError(
            "Nenhum perfil foi especificado."
        );

        return;
    }

    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select(
            "id, username, created_at, avatar_url, bio, achievements"
        )
        .eq("id", profileId)
        .single();

    if (profileError || !profile) {
        console.error(profileError);

        showError(
            "Não foi possível encontrar este perfil."
        );

        return;
    }

    let catalog;

    try {
        const response =
            await fetch(ACHIEVEMENTS_JSON_URL);

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        catalog = await response.json();

    } catch (error) {

        console.error(
            "Erro ao carregar conquistas:",
            error
        );

        showError(
            "Não foi possível carregar as conquistas."
        );

        return;
    }

    usernameElement.textContent =
        profile.username || "Usuário";

    createdAtElement.textContent =
        formatDate(profile.created_at);

    bioElement.textContent =
        profile.bio || "";

    avatarElement.src =
        profile.avatar_url || DEFAULT_AVATAR;

    avatarElement.onerror = function () {
        this.src = DEFAULT_AVATAR;
    };

    renderAchievements(
        profile.achievements,
        catalog
    );

    profileCard.style.display = "block";
}


supabaseClient.auth.onAuthStateChange(
    (_event, _session) => {
        updateAuthLink();
    }
);


updateAuthLink();
loadProfile();
</script>

</body>
</html>
