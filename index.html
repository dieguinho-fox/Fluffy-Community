<!-- AVISOS DO FLUFFY ACCOUNT -->

<div
    id="announcementContainer"
    class="announcement-container"
></div>


<main>

    <h2>Bem-vindo!</h2>

    <p>
        Aqui você poderá encontrar nossos jogos,
        notícias e, futuramente, os fóruns da comunidade.
    </p>

</main>


<script>

    /*
     * CONFIGURAÇÃO DO SUPABASE
     */

    const SUPABASE_URL =
        "https://wnihobtfpmabgfwoddye.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_Y-S1kbAXQE-Y4j-seMaHrQ_u_vUoTFF";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /*
     * ELEMENTOS
     */

    const announcementContainer =
        document.getElementById(
            "announcementContainer"
        );


    /*
     * CARREGAR AVISOS
     */

    async function loadAnnouncements() {

        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("announcements")
                .select(
                    "id, title, message, priority, created_at, expires_at"
                )
                .eq("active", true)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Erro ao carregar avisos:",
                    error
                );

                return;
            }


            /*
             * LIMPAR AVISOS EXISTENTES
             */

            announcementContainer.innerHTML = "";


            /*
             * FILTRAR AVISOS EXPIRADOS
             */

            const now = new Date();

            const activeAnnouncements =
                data.filter(function(announcement) {

                    if (!announcement.expires_at) {
                        return true;
                    }

                    return (
                        new Date(
                            announcement.expires_at
                        ) > now
                    );

                });


            /*
             * NENHUM AVISO
             */

            if (
                activeAnnouncements.length === 0
            ) {

                announcementContainer.style.display =
                    "none";

                return;
            }


            announcementContainer.style.display =
                "block";


            /*
             * MOSTRAR AVISOS
             */

            activeAnnouncements.forEach(
                function(announcement) {

                    const box =
                        document.createElement(
                            "div"
                        );

                    box.className =
                        "announcement " +
                        announcement.priority;


                    const title =
                        document.createElement(
                            "h3"
                        );

                    title.className =
                        "announcement-title";


                    const icon =
                        announcement.priority === "high"
                            ? "🔴"
                            : announcement.priority === "medium"
                                ? "🟡"
                                : "🟢";


                    title.textContent =
                        icon +
                        " " +
                        announcement.title;


                    const message =
                        document.createElement(
                            "p"
                        );

                    message.className =
                        "announcement-message";

                    message.textContent =
                        announcement.message;


                    box.appendChild(title);

                    box.appendChild(message);


                    /*
                     * DATA DO AVISO
                     */

                    if (
                        announcement.created_at
                    ) {

                        const date =
                            document.createElement(
                                "div"
                            );

                        date.className =
                            "announcement-date";

                        const createdDate =
                            new Date(
                                announcement.created_at
                            );


                        date.textContent =
                            "Publicado em " +
                            createdDate.toLocaleDateString(
                                "pt-BR"
                            );


                        box.appendChild(date);
                    }


                    announcementContainer
                        .appendChild(box);

                }
            );

        } catch (error) {

            console.error(
                "Erro inesperado ao carregar avisos:",
                error
            );

        }

    }


    /*
     * INICIAR
     */

    loadAnnouncements();

</script>
